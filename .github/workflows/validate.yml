name: Validate site and Together

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prayer:check
      - run: npm run prayer:test
      - run: npm test -- --watchAll=false --runInBand --watchman=false
        env:
          CI: true
      - run: npm run build:frontend
        env:
          CI: true

  # The multiplatform Commons app (apps/commons) has its own install. Its
  # typecheck needs convex/_generated, which only `npx convex dev` against a
  # deployment can write, so CI runs the unit tests and the web export.
  commons-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/commons
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/commons/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx expo export --platform web --output-dir /tmp/commons-web

name: Validate site and Together

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prayer:check
      - run: npm run prayer:test
      - run: npm test -- --watchAll=false --runInBand --watchman=false
        env:
          CI: true
      - run: npm run build:frontend
        env:
          CI: true

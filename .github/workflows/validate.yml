name: Validate site and Together

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prayer:check
      - run: npm run prayer:test
      - run: npm test -- --watchAll=false --runInBand --watchman=false
        env:
          CI: true
      - run: npm run build:frontend
        env:
          CI: true

  # The multiplatform Commons app (apps/commons) has its own install. Its
  # typecheck also reads the Convex functions (for their argument and result
  # types), so the root install is needed too, and convex/_generated is
  # written offline from the source: no deployment, no secrets.
  commons-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/commons
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/commons/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm ci --no-audit --no-fund
      - run: node scripts/convex-types.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform web --output-dir /tmp/commons-web
